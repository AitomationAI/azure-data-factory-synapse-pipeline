[project]
name = "azure-claims-pipeline"
version = "1.0.0"
description = "Azure Data Factory + Synapse Analytics claims data platform (IaC, pipelines, T-SQL, validation)."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aitomation" }]

[project.optional-dependencies]
dev = ["pytest>=8.0", "sqlfluff>=3.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.sqlfluff.core]
dialect = "tsql"
